<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Available Slots</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="navbar">
    <h3>🏥 Doctor Appointment</h3>
    <div class="nav-links">
        <a href="doctors.html">Doctors</a>
        <a href="my-appointments.html">My Appointments</a>
        <a href="#" onclick="logout()">Logout</a>
    </div>
</div>

<div class="page-content">
    <h2 style="margin-bottom: 20px;">Available Slots</h2>
    <div id="msgBox"></div>
    <div id="slotsList"></div>
</div>

<!-- Booking Confirmation Modal -->
<div id="bookingModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); align-items:center; justify-content:center;">
    <div style="background:white; padding:30px; border-radius:10px; max-width:400px; width:90%;">
        <h3 style="margin-bottom:15px;">Confirm Appointment</h3>
        <p style="margin-bottom:10px; color:#666;">Slot locked! Please confirm within 5 minutes.</p>
        <label style="display:block; margin-bottom:6px; font-size:14px; color:#555;">Reason for Visit</label>
        <textarea id="reasonInput" rows="3" style="width:100%; padding:10px; border:1px solid #ddd; border-radius:6px; margin-bottom:15px;" placeholder="E.g. Regular checkup, fever, etc."></textarea>
        <button class="btn-small" style="width:100%; margin-bottom:10px;" onclick="confirmBooking()">Confirm Booking</button>
        <button class="btn-small" style="width:100%; background:#999;" onclick="closeModal()">Cancel</button>
    </div>
</div>

<script src="js/api.js"></script>
<script src="js/add-slot.js"></script>
</body>
</html>
