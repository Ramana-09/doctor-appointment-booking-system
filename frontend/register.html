<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Register - Doctor Appointment</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="container">
    <div class="form-box">
        <h2>Register</h2>

        <div id="errorMsg" class="error-msg"></div>
        <div id="successMsg" class="success-msg"></div>

        <form id="registerForm">
            <label>Name</label>
            <input type="text" id="name" required placeholder="Enter your name">

            <label>Email</label>
            <input type="email" id="email" required placeholder="Enter your email">

            <label>Password</label>
            <input type="password" id="password" required placeholder="Enter password">

            <label>I am a</label>
            <select id="role" required onchange="toggleDoctorFields()">
                <option value="">Select role</option>
                <option value="PATIENT">Patient</option>
                <option value="DOCTOR">Doctor</option>
            </select>

            <div id="doctorFields" style="display:none;">
                <label>Specialization</label>
                <input type="text" id="specialization" placeholder="E.g. Cardiology">

                <label>Experience (years)</label>
                <input type="number" id="experience" placeholder="E.g. 5">

                <label>Clinic Address</label>
                <input type="text" id="clinicAddress" placeholder="E.g. Coimbatore">
            </div>

            <button type="submit">Register</button>
        </form>

        <p class="switch-link">Already have an account? <a href="index.html">Login here</a></p>
    </div>
</div>

<script src="js/api.js"></script>
<script src="js/register.js"></script>
</body>
</html>
